plugins {
    id 'com.android.application'
}

android {
    namespace 'it.pitwall.pitcomm'
    compileSdk 34

    defaultConfig {
        applicationId 'it.pitwall.pitcomm'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.2'
    }

    // Chiave fissa (solo di prova): cosi' ogni nuova versione si installa sopra la
    // vecchia senza disinstallare. Non protegge niente: l'app non e' sul Play Store.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
